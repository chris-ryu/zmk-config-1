# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  # cradio (nice_nano_v2 사용)
  - board: nice_nano_v2
    shield: cradio_left
  - board: nice_nano_v2
    shield: cradio_right
  
  # dyad (seeeduino_xiao_ble 사용)
  - board: seeeduino_xiao_ble
    shield: dyad_central_dongle
    artifact-name: dyad_central_dongle
  - board: seeeduino_xiao_ble
    shield: dyad_peripheral_left
    artifact-name: dyad_peripheral_left
  - board: seeeduino_xiao_ble
    shield: dyad_peripheral_right
    artifact-name: dyad_peripheral_right
  - board: seeeduino_xiao_ble
    shield: settings_reset
