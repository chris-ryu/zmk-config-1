name: Draw ZMK Keymaps

on:
  push:
    branches:
      - main
    paths:
      - 'config/*.keymap'
      - 'config/*.dtsi'
      - 'draw/config.yaml'
  pull_request:
    paths:
      - 'config/*.keymap'
      - 'config/*.dtsi'
      - 'draw/config.yaml'
  workflow_dispatch:

jobs:
  draw:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install keymap-drawer
        run: pip install keymap-drawer
        
      - name: Draw keymaps
        run: |
          # config 디렉토리에서 keymap 파일 찾기
          for keymap in config/*.keymap; do
            if [ -f "$keymap" ]; then
              base=$(basename "$keymap" .keymap)
              echo "Drawing keymap for $base"
              
              # keymap을 YAML로 파싱
              keymap parse -z "$keymap" > "draw/${base}.yaml"
              
              # SVG 이미지 생성
              keymap draw "draw/${base}.yaml" > "draw/${base}.svg"
            fi
          done
          
      - name: Commit and push images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add draw/*.yaml draw/*.svg
          git diff --staged --quiet || git commit -m "Update keymap images [skip ci]"
          git push
