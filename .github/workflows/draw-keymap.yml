name: Draw ZMK Keymaps

on:
  push:
    branches:
      - main
    paths:
      - 'config/*.keymap'
      - 'config/*.dtsi'
      - 'draw/config.yaml'
  pull_request:
    paths:
      - 'config/*.keymap'
      - 'config/*.dtsi'
      - 'draw/config.yaml'
  workflow_dispatch:

jobs:
  draw:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          pip install west 'keymap-drawer>=0.22.0'
          
      - name: Initialize ZMK modules
        run: |
          west init -l config
          west update
        
      - name: Draw keymaps
        run: |
          # config 디렉토리에서 keymap 파일 찾기
          for keymap in config/*.keymap; do
            if [ -f "$keymap" ]; then
              base=$(basename "$keymap" .keymap)
              
              # base.keymap은 실제 키보드가 아닌 공유 레이아웃이므로 건너뛰기
              if [ "$base" = "base" ]; then
                echo "Skipping $base (shared layout, not a physical keyboard)"
                continue
              fi
              
              echo "Drawing keymap for $base"
              
              # keymap을 YAML로 파싱 (config 파일 사용)
              keymap -c draw/config.yaml parse -z "$keymap" > "draw/${base}.yaml"
              
              # SVG 이미지 생성 (config 파일 사용)
              keymap -c draw/config.yaml draw "draw/${base}.yaml" > "draw/${base}.svg"
            fi
          done
          
      - name: Commit and push images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add draw/*.yaml draw/*.svg
          git diff --staged --quiet || git commit -m "Update keymap images [skip ci]"
          git push
